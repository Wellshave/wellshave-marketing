# Netlify configuration for the Atelier Console (Wellgroup ad generator).
# Pure static single-file app — no build step. Only the atelier-console/
# folder is published, so nothing else in this repo is ever exposed.
[build]
  command = ""
  publish = "atelier-console"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
