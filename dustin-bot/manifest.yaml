display_information:
  name: Dustin 2.0
  description: Dustin's AI ops assistant - daily digests, task nudges, and follow-ups from the Production Lab.
  background_color: "#1a1d21"
features:
  bot_user:
    display_name: Dustin 2.0
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      - users:read
      - users:read.email
      - channels:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
